name: Genera ZackD Short

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'scene.html'
      - 'voice.txt'
      - 'video_finale.mp4'

concurrency:
  group: zackd-video-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa FFmpeg, Edge-TTS e dipendenze Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg google-chrome-stable
          pip install --upgrade edge-tts gTTS --break-system-packages
          npm init -y || true
          npm install puppeteer

      - name: 1. Cerca video Zack D. e genera scene.html + voice.txt (3 Agenti DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node generate.js

      - name: 2. Genera la voce stile Zack D. (con triplo fallback anti-errore)
        run: |
          edge-tts --file voice.txt --voice en-US-BrianMultilingualNeural --rate=+10% --write-media voice.mp3 || \
          edge-tts --file voice.txt --voice en-US-ChristopherNeural --write-media voice.mp3 || \
          edge-tts --file voice.txt --voice en-US-GuyNeural --write-media voice.mp3 || \
          gtts-cli -f voice.txt -l en --output voice.mp3
          ls -lh voice.mp3

      - name: 3. Renderizza il video 3D veloce (Upscale 1080x1920) da scene.html
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
        run: node render_output.js

      - name: 4. Verifica e unisci la traccia vocale a video_finale.mp4
        run: |
          if [ -f "video_finale.mp4" ] && [ -f "voice.mp3" ]; then
            HAS_AUDIO=$(ffprobe -i video_finale.mp4 -show_streams -select_streams a -loglevel error)
            if [ -z "$HAS_AUDIO" ]; then
              echo "Aggiungo la traccia vocale a video_finale.mp4..."
              ffmpeg -y -i video_finale.mp4 -i voice.mp3 -c:v copy -c:a aac -b:a 192k -shortest video_con_audio.mp4
              mv video_con_audio.mp4 video_finale.mp4
            fi
          fi

      - name: 5. Salva scene.html, voice.txt e video_finale.mp4 nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scene.html voice.txt video_finale.mp4
          if ! git diff --staged --quiet; then
            git commit -m "Nuovo video 3D stile Zack D. (3 Agenti + Fast Render)"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main --force
          fi
