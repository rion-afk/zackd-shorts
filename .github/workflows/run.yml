name: Video
on: [workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node generate.js
      - run: |
          git config user.name "Bot"
          git config user.email "bot@bot"
          git add render_output.js
          git commit -m "Nuovo video 3D" || true
          git push
