<!DOCTYPE html><html><head><meta charset='utf-8'><style>html,body{margin:0;padding:0;background:#000;overflow:hidden;width:1080px;height:1920px}canvas{display:block}</style></head><body><canvas id='c' width='1080' height='1920'></canvas><script>
const cv=document.getElementById('c');const ctx=cv.getContext('2d');
const W=1080,H=1920;
function radialGloss(cx,cy,r,c1,c2,c3,shine){const g=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.05,cx,cy,r);g.addColorStop(0,c1);g.addColorStop(0.55,c2);g.addColorStop(1,c3);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();if(shine){const s=ctx.createRadialGradient(cx-r*0.35,cy-r*0.4,r*0.01,cx-r*0.3,cy-r*0.35,r*0.5);s.addColorStop(0,'rgba(255,255,255,0.9)');s.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=s;ctx.beginPath();ctx.arc(cx-r*0.3,cy-r*0.35,r*0.45,0,Math.PI*2);ctx.fill();}}
function drawPerson(cx,cy,scale,t,skin,torso){const bob=Math.sin(t*2)*8*scale;cy+=bob;
// legs
ctx.fillStyle=torso;ctx.save();ctx.translate(cx,cy);
// torso
ctx.beginPath();ctx.ellipse(0,0,90*scale,130*scale,0,0,Math.PI*2);ctx.fillStyle=torso;ctx.fill();
// shirt gradient
const tg=ctx.createLinearGradient(-90*scale,-130*scale,90*scale,130*scale);tg.addColorStop(0,'rgba(255,255,255,0.35)');tg.addColorStop(1,'rgba(0,0,0,0.25)');ctx.fillStyle=tg;ctx.beginPath();ctx.ellipse(0,0,90*scale,130*scale,0,0,Math.PI*2);ctx.fill();
// head
radialGloss(0,-175*scale,70*scale,skin,skin,'#b07050',true);
// hair
ctx.fillStyle='#2a1a0a';ctx.beginPath();ctx.arc(0,-195*scale,68*scale,Math.PI*1.05,Math.PI*1.95);ctx.fill();
// eyes
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-25*scale,-180*scale,14*scale,0,Math.PI*2);ctx.arc(25*scale,-180*scale,14*scale,0,Math.PI*2);ctx.fill();
const blink=Math.sin(t*3)>0.95?0.15:1;ctx.fillStyle='#1a3a6a';ctx.beginPath();ctx.ellipse(-25*scale,-180*scale,8*scale,8*scale*blink,0,0,Math.PI*2);ctx.ellipse(25*scale,-180*scale,8*scale,8*scale*blink,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-27*scale,-182*scale,3*scale,0,Math.PI*2);ctx.arc(23*scale,-182*scale,3*scale,0,Math.PI*2);ctx.fill();
// mouth
ctx.strokeStyle='#8a3030';ctx.lineWidth=3*scale;ctx.beginPath();ctx.arc(0,-150*scale,12*scale,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
ctx.restore();}
function drawBrain(cx,cy,r,t){radialGloss(cx,cy,r,'#ffb0c0','#e06080','#801030',true);
ctx.strokeStyle='rgba(120,20,50,0.7)';ctx.lineWidth=6;for(let i=0;i<12;i++){const a=i/12*Math.PI*2+Math.sin(t+i)*0.1;ctx.beginPath();ctx.moveTo(cx,cy);ctx.quadraticCurveTo(cx+Math.cos(a)*r*0.6,cy+Math.sin(a)*r*0.6,cx+Math.cos(a)*r*0.9,cy+Math.sin(a)*r*0.9);ctx.stroke();}
// pulses
for(let i=0;i<5;i++){const p=(t*0.6+i*0.2)%1;ctx.fillStyle='rgba(255,240,120,'+(1-p)+')';const a=i/5*Math.PI*2;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r*0.7*p,cy+Math.sin(a)*r*0.7*p,10*(1-p)+3,0,Math.PI*2);ctx.fill();}}
function drawLimb(cx,cy,t,ghost){ctx.save();ctx.globalAlpha=ghost?0.45+Math.sin(t*4)*0.2:1;
ctx.fillStyle=ghost?'#60d0ff':'#e8b090';ctx.beginPath();ctx.ellipse(cx,cy,50,140,0,0,Math.PI*2);ctx.fill();
const g=ctx.createLinearGradient(cx-50,cy,cx+50,cy);g.addColorStop(0,'rgba(255,255,255,0.5)');g.addColorStop(1,'rgba(0,0,0,0.3)');ctx.fillStyle=g;ctx.fill();
if(ghost){ctx.strokeStyle='rgba(120,220,255,0.8)';ctx.lineWidth=4;ctx.setLineDash([12,10]);ctx.beginPath();ctx.ellipse(cx,cy,50,140,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
ctx.restore();}
function caption(txt,sub,alpha,y){ctx.textAlign='center';ctx.font='bold 78px Arial Black,sans-serif';ctx.lineWidth=12;ctx.strokeStyle='rgba(0,0,0,'+alpha+')';ctx.strokeText(txt,W/2,y);const g=ctx.createLinearGradient(0,y-70,0,y+20);g.addColorStop(0,'#ffffff');g.addColorStop(0.5,'#ffe000');g.addColorStop(1,'#ffb000');ctx.fillStyle=g;ctx.globalAlpha=alpha;ctx.fillText(txt,W/2,y);ctx.globalAlpha=1;if(sub){ctx.font='bold 44px Arial';ctx.lineWidth=8;ctx.strokeStyle='rgba(0,0,0,'+alpha+')';ctx.strokeText(sub,W/2,y+65);ctx.fillStyle='#fff';ctx.globalAlpha=alpha;ctx.fillText(sub,W/2,y+65);ctx.globalAlpha=1;}}
window.renderFrame=function(t){
// bg gradient
const bg=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,1200);bg.addColorStop(0,'#1a0a20');bg.addColorStop(0.6,'#0a0410');bg.addColorStop(1,'#000');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// floating particles
for(let i=0;i<60;i++){const x=(i*137+t*30)%W;const y=(i*271+t*15)%H;ctx.fillStyle='rgba(120,180,255,'+(0.1+0.1*Math.sin(t+i))+')';ctx.beginPath();ctx.arc(x,y,2+Math.sin(t+i)*1.5,0,Math.PI*2);ctx.fill();}
// scene phases
if(t<8){drawPerson(W/2,H/2+150,1.6,t,'#e8b090','#3a6ac0');drawLimb(W/2-260,H/2+420,t,true);
 caption('ARTO FANTASMA',t<4?'Il corpo c\'è, ma non c\'è':'“Sento la gamba muoversi”',Math.min(1,t*1.5),(t<4?500:600));
} else if(t<16){drawBrain(W/2,H/2-100,240,t);
 caption('IL CERVELLO RICOSTRUISCE','Mappa neuronale che si riscrive',Math.min(1,(t-8)*2),500);
 // zoom veins
 ctx.strokeStyle='rgba(255,120,150,0.5)';ctx.lineWidth=3;for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(W/2,H/2-100);const a=t*0.5+i;ctx.lineTo(W/2+Math.cos(a)*400,H/2-100+Math.sin(a)*400);ctx.stroke();}
} else {drawPerson(W/2,H/2+150,1.6,t,'#e8b090','#3a6ac0');drawLimb(W/2-260,H/2+420,t,true);drawBrain(W/2+300,H/2-450,110,t);
 caption('REALE QUANTO VERO','La mente non dimentica',Math.min(1,(t-16)*2),500);}
// vignette
const vg=ctx.createRadialGradient(W/2,H/2,400,W/2,H/2,1100);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.75)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
};
renderFrame(0);
</script></body></html>
