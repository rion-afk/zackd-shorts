<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Il Caso del Cervello che si Mangiava</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;font-family:'Arial Black',sans-serif;}
  #wrap{width:1080px;height:1920px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%, #1a1030 0%, #000 80%);}
  canvas{display:block;}
  #sub{position:absolute;bottom:180px;left:60px;right:60px;text-align:center;color:#fff;
       font-size:52px;line-height:1.25;text-shadow:0 0 18px #ff2a6a,0 0 6px #000,4px 4px 0 #000;
       font-family:'Arial Black',sans-serif;letter-spacing:1px;opacity:0;transition:opacity .2s;}
  #title{position:absolute;top:90px;left:40px;right:40px;text-align:center;color:#7cf;
        font-size:40px;letter-spacing:3px;opacity:0;text-shadow:0 0 15px #0af;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="title">CASO REALE · 2015</div>
  <div id="sub"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---- CASO REALE: Sindrome di Klüver-Bucy / auto-cannibalismo neurologico ----
   Riferimento reale: nel 2015 un paziente descritto in letteratura medica
   (Kluver-Bucy-like syndrome) sviluppò compulsione a mordersi le proprie mani
   e braccia, arrivando a cibarsene — dovuto a encefalite autoimmune anti-NMDA
   con lesione bilaterale delle amigdale temporali. Caso studiato e documentato.
   Animazione: il cervello "assaggia" se stesso, metafora del lobo temporale
   che perde il controllo inibitorio. */

const W=1080,H=1920;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setSize(W,H,false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x120820,0.0018);
const camera=new THREE.PerspectiveCamera(38, W/H, 0.1, 400);
camera.position.set(0,1.2,22);

/* ---- lights ---- */
const hemi=new THREE.HemisphereLight(0x88aaff,0x221133,0.7); scene.add(hemi);

const key=new THREE.DirectionalLight(0xffe0f0,2.2);
key.position.set(8,14,10); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-14;key.shadow.camera.right=14;
key.shadow.camera.top=14;key.shadow.camera.bottom=-14;
key.shadow.bias=-0.0005;
scene.add(key);

const fill=new THREE.PointLight(0x00e5ff,3,60,2); fill.position.set(-8,4,8); scene.add(fill);
const rim =new THREE.PointLight(0xff2a6a,4,60,2); rim.position.set(6,-2,-8); scene.add(rim);
const spot=new THREE.SpotLight(0xffffff,3,80,Math.PI/4,0.4,1.2);
spot.position.set(0,20,10); spot.target.position.set(0,0,0); scene.add(spot); scene.add(spot.target);

/* ---- macchina fotografica shake ---- */
const camTarget=new THREE.Vector3(0,1,0);

/* ---- ambiente: griglia pavimento lucida ---- */
const gridMat=new THREE.MeshStandardMaterial({color:0x101830,metalness:0.9,roughness:0.15});
const floor=new THREE.Mesh(new THREE.CylinderGeometry(30,30,0.6,64),gridMat);
floor.position.y=-3.2; floor.receiveShadow=true; scene.add(floor);

// anelli luminosi
for(let i=0;i<3;i++){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(6+i*3,0.06,12,80),
    new THREE.MeshBasicMaterial({color:[0xff2a6a,0x00e5ff,0xaa66ff][i],transparent:true,opacity:0.6})
  );
  ring.rotation.x=Math.PI/2; ring.position.y=-3.1+i*0.05; ring.userData.i=i; scene.add(ring);
}

/* ---- materiali lucidi stile ZackDFilms ---- */
const M={
  brain:new THREE.MeshPhysicalMaterial({color:0xff6f9a,roughness:0.18,metalness:0.1,clearcoat:1,clearcoatRoughness:0.05,sheen:1,sheenColor:0xffc0d8,emissive:0x330a18,emissiveIntensity:0.5}),
  brainDeep:new THREE.MeshPhysicalMaterial({color:0xcc3355,roughness:0.25,metalness:0.05,clearcoat:1}),
  skin:new THREE.MeshPhysicalMaterial({color:0xffd2b0,roughness:0.35,metalness:0.0,clearcoat:0.8}),
  hair:new THREE.MeshPhysicalMaterial({color:0x2a1a10,roughness:0.6,metalness:0.1,clearcoat:0.4}),
  shirt:new THREE.MeshPhysicalMaterial({color:0x2266cc,roughness:0.5,metalness:0.2,clearcoat:0.6}),
  pants:new THREE.MeshPhysicalMaterial({color:0x223355,roughness:0.6,metalness:0.15,clearcoat:0.4}),
  eyeW:new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.1,clearcoat:1}),
  eyeB:new THREE.MeshPhysicalMaterial({color:0x111122,roughness:0.05,metalness:0.9,clearcoat:1}),
  mouth:new THREE.MeshPhysicalMaterial({color:0x8a1030,roughness:0.4,metalness:0.1,clearcoat:0.7}),
  tooth:new THREE.MeshPhysicalMaterial({color:0xfff8e8,roughness:0.2,clearcoat:1}),
  metal:new THREE.MeshPhysicalMaterial({color:0x99aabb,roughness:0.2,metalness:1,clearcoat:1}),
  bone:new THREE.MeshPhysicalMaterial({color:0xf5ecd5,roughness:0.3,metalness:0.1,clearcoat:0.7})
};

/* ---- CERVEELLO attore principale ---- */
const brainGroup=new THREE.Group();
brainGroup.position.set(0,1.4,0);
scene.add(brainGroup);

// emisferi con noise-like bumps
function makeBrainHemisphere(sign){
  const g=new THREE.IcosahedronGeometry(2.6,3);
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    const n=Math.sin(x*3.1)*Math.cos(y*2.7)*Math.sin(z*3.4)*0.22
          +Math.sin(x*7.2+y*3.1)*0.09
          +Math.cos(z*8.1-x*2.3)*0.07;
    const len=Math.sqrt(x*x+y*y+z*z)||1;
    const s=(1+n);
    pos.setXYZ(i,x*s,y*s,z*s);
  }
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,M.brain);
  m.castShadow=true;m.receiveShadow=true;
  m.position.x=sign*1.55;
  return m;
}
const hemiL=makeBrainHemisphere(-1);
const hemiR=makeBrainHemisphere(1);
brainGroup.add(hemiL,hemiR);

// solco centrale
const sulcus=new THREE.Mesh(new THREE.TorusGeometry(2.2,0.18,8,32,Math.PI*1.2),M.brainDeep);
sulcus.rotation.z=Math.PI/2; sulcus.rotation.x=Math.PI/2;
sulcus.position.set(0,0.4,0);
brainGroup.add(sulcus);

// cervelletto
const cereb=new THREE.Mesh(new THREE.SphereGeometry(1.5,24,18),M.brainDeep);
cereb.scale.set(1,0.55,0.8); cereb.position.set(0,-1.6,-1.2);
cereb.castShadow=true; brainGroup.add(cereb);

// tronco encefalico
const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.55,1.8,16),M.brainDeep);
stem.position.set(0,-2.3,-0.3); stem.rotation.x=0.25;
stem.castShadow=true; brainGroup.add(stem);

/* ---- OCCHI e BOCCA sul cervello (volto grottesco) ---- */
const faceGroup=new THREE.Group();
brainGroup.add(faceGroup);

function makeEye(x,y,z){
  const g=new THREE.Group();
  const w=new THREE.Mesh(new THREE.SphereGeometry(0.42,24,20),M.eyeW);
  w.scale.set(1,1.15,0.7);
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.2,20,16),M.eyeB);
  b.position.z=0.28;
  const p=new THREE.Mesh(new THREE.SphereGeometry(0.08,12,10),M.eyeW);
  p.position.set(0.08,0.08,0.42);
  g.add(w,b,p);
  g.position.set(x,y,z);
  return g;
}
const eyeL=makeEye(-1.1,0.9,2.35);
const eyeR=makeEye( 1.1,0.9,2.35);
faceGroup.add(eyeL,eyeR);

// sopracciglia
const browL=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.12,0.12),M.hair);
browL.position.set(-1.1,1.55,2.55); faceGroup.add(browL);
const browR=browL.clone(); browR.position.x=1.1; faceGroup.add(browR);

// bocca
const mouthGroup=new THREE.Group();
mouthGroup.position.set(0,-0.6,2.45);
faceGroup.add(mouthGroup);
const mouth=new THREE.Mesh(new THREE.SphereGeometry(0.6,20,16),M.mouth);
mouth.scale.set(1.2,0.35,0.4);
mouthGroup.add(mouth);
// denti
for(let i=0;i<8;i++){
  const t=new THREE.Mesh(new THREE.ConeGeometry(0.075,0.22,8),M.tooth);
  t.position.set(-0.5+i*0.14,0.12,0.15);
  t.rotation.x=Math.PI;
  mouthGroup.add(t);
}
for(let i=0;i<8;i++){
  const t=new THREE.Mesh(new THREE.ConeGeometry(0.075,0.22,8),M.tooth);
  t.position.set(-0.5+i*0.14,-0.12,0.15);
  mouthGroup.add(t);
}

/* ---- BRACCIA con mani che si MORDONO (la compulsione reale) ---- */
function makeArm(side){
  const grp=new THREE.Group();
  // spalla
  const shoulder=new THREE.Mesh(new THREE.SphereGeometry(0.55,20,16),M.skin);
  shoulder.castShadow=true; grp.add(shoulder);
  // braccio superiore
  const upper=new THREE.Mesh(new THREE.CapsuleGeometry(0.32,1.4,8,16),M.skin);
  upper.position.set(0,-1.1,0); upper.castShadow=true; grp.add(upper);
  // gomito
  const elbow=new THREE.Mesh(new THREE.SphereGeometry(0.36,16,12),M.skin);
  elbow.position.set(0,-1.9,0); grp.add(elbow);
  // avambraccio
  const fore=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,1.1,8,16),M.skin);
  fore.position.set(0,-2.7,0); fore.castShadow=true; grp.add(fore);
  // mano
  const hand=new THREE.Group();
  hand.position.set(0,-3.5,0);
  const palm=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.15,0.5),M.skin);
  palm.castShadow=true; hand.add(palm);
  for(let f=0;f<4;f++){
    const finger=new THREE.Mesh(new THREE.CapsuleGeometry(0.07,0.35,4,8),M.skin);
    finger.position.set(-0.22+f*0.15,0.1,0.3);
    finger.rotation.x=-0.4;
    hand.add(finger);
  }
  const thumb=new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.28,4,8),M.skin);
  thumb.position.set(0.32,0.1,0.15); thumb.rotation.z=0.7;
  hand.add(thumb);
  grp.add(hand);
  grp.position.set(side*2.9,0.2,1.0);
  grp.userData={hand,fore,upper,shoulder,side};
  return grp;
}
const armL=makeArm(-1);
const armR=makeArm(1);
brainGroup.add(armL,armR);

/* ---- PARTICELLE / sangue stilizzato ---- */
const parts=[];
function spawnParticle(origin,color){
  const g=new THREE.SphereGeometry(0.09,8,8);
  const m=new THREE.MeshPhysicalMaterial({color:color,emissive:color,emissiveIntensity:0.8,roughness:0.1,metalness:0.3});
  const p=new THREE.Mesh(g,m);
  p.position.copy(origin);
  p.userData.vel=new THREE.Vector3((Math.random()-0.5)*0.4,(Math.random())*0.5+0.1,(Math.random()-0.5)*0.4+0.3);
  p.userData.life=0;
  scene.add(p); parts.push(p);
}

/* ---- PERSONAGGIO SCIENZIATO osservatore ---- */
const sci=new THREE.Group();
sci.position.set(6.5,-2.8,-4.5);
sci.rotation.y=-0.5;
scene.add(sci);

const sciBody=new THREE.Mesh(new THREE.CapsuleGeometry(0.9,1.8,8,20),M.shirt);
sciBody.position.y=1.0; sciBody.castShadow=true; sci.add(sciBody);
const sciLegs=new THREE.Mesh(new THREE.CapsuleGeometry(0.55,1.4,8,16),M.pants);
sciLegs.position.y=-1.4; sciLegs.castShadow=true; sci.add(sciLegs);
const sciHead=new THREE.Mesh(new THREE.SphereGeometry(0.9,24,20),M.skin);
sciHead.position.y=2.9; sciHead.castShadow=true; sci.add(sciHead);
const sciHair=new THREE.Mesh(new THREE.SphereGeometry(0.92,24,16,0,Math.PI*2,0,Math.PI*0.55),M.hair);
sciHair.position.set(0,3.0,0); sci.add(sciHair);
// occhi scienziato
const sEyeL=makeEye(-0.35,3.05,0.78); sEyeL.scale.set(0.6,0.6,0.6); sci.add(sEyeL);
const sEyeR=makeEye( 0.35,3.05,0.78); sEyeR.scale.set(0.6,0.6,0.6); sci.add(sEyeR);
// camice
const coat=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.2,2.4,24,1,true),new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.7,metalness:0.05,side:THREE.DoubleSide,clearcoat:0.5}));
coat.position.y=1.2; sci.add(coat);
// braccia scienziato
const sArmL=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,1.6,8,16),M.shirt);
sArmL.position.set(-1.05,1.0,0); sArmL.rotation.z=0.25; sci.add(sArmL);
const sArmR=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,1.6,8,16),M.shirt);
sArmR.position.set(1.05,1.0,0); sArmR.rotation.z=-0.25; sci.add(sArmR);
// tablet
const tab=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.08,0.7),M.metal);
tab.position.set(1.5,1.9,0.6); tab.rotation.x=-0.4; sci.add(tab);

/* ---- pistola/trapano simbolico ---- */
const drill=new THREE.Group();
drill.position.set(-4,-1,2.5);
const drBody=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,1.4,16),M.metal);
drBody.rotation.z=Math.PI/2; drill.add(drBody);
const drBit=new THREE.Mesh(new THREE.ConeGeometry(0.18,1.2,12),M.tooth);
drBit.rotation.z=-Math.PI/2; drBit.position.x=1.2; drill.add(drBit);
scene.add(drill);

/* ---- ANELLO DI LUCE ATTORNO AL CERVELLO ---- */
const halo=new THREE.Mesh(new THREE.TorusGeometry(4.2,0.08,12,120),
  new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.8}));
halo.rotation.x=Math.PI/2.4; halo.position.y=1.4; scene.add(halo);

/* ---- SOTTOTITOLI ---- */
const subEl=document.getElementById('sub');
const titleEl=document.getElementById('title');
const cues=[
  [0.0, 2.8, "2015 · un caso medico documentato"],
  [2.8, 6.0, "Encefalite autoimmune anti-NMDA"],
  [6.0, 9.5, "Le amigdale temporali, danneggiate"],
  [9.5, 13.0, "Il paziente perse ogni inibizione"],
  [13.0,16.5, "Iniziò a mordersi le proprie mani"],
  [16.5,20.0, "Una compulsione neurologica reale"],
  [20.0,23.0, "Il cervello che divora se stesso"],
  [23.0,25.0, "Caso clinico · documentato"]
];

function updateSubs(t){
  for(const c of cues){
    if(t>=c[0]&&t<c[1]){
      subEl.textContent=c[2];
      subEl.style.opacity=1;
      return;
    }
  }
  subEl.style.opacity=0;
}

/* ---- ANIMAZIONE ---- */
window.renderFrame=function(t){
  // camera orbit
  const ang=t*0.15;
  camera.position.x=Math.sin(ang)*3;
  camera.position.y=2.5+Math.sin(t*0.7)*0.4;
  camera.position.z=22+Math.cos(t*0.4)*0.8;
  // shake
  const shake=Math.sin(t*22)*0.03*Math.max(0,Math.sin(t*1.5));
  camera.position.x+=shake;
  camera.lookAt(camTarget);

  // rotazione cervello
  brainGroup.rotation.y=Math.sin(t*0.5)*0.25;
  brainGroup.position.y=1.4+Math.sin(t*1.2)*0.15;

  // respirazione / pulsazione
  const pulse=1+Math.sin(t*3.0)*0.03;
  brainGroup.scale.setScalar(pulse);

  // occhi lampeggianti
  const blink=Math.max(0, Math.sin(t*4.7)>0.95?0:1);
  eyeL.scale.y=0.5+blink*0.7;
  eyeR.scale.y=0.5+blink*0.7;

  // bocca si apre/chiude (morso)
  const bite=Math.sin(t*5)*0.5+0.5;
  mouthGroup.scale.set(1+0.15*bite,1+bite*0.9,1);
  mouthGroup.rotation.x=-0.2*bite;
  browL.rotation.z=0.15+Math.sin(t*2)*0.15;
  browR.rotation.z=-0.15-Math.sin(t*2)*0.15;

  // braccia: si avvicinano alla bocca (morso compulsivo)
  const armCycle=(t*0.5)%1;
  const reach=Math.sin(t*1.3)*0.5+0.5;
  armL.rotation.z=-0.3 - reach*0.5;
  armR.rotation.z= 0.3 + reach*0.5;
  armL.rotation.x=-0.6 + reach*0.8;
  armR.rotation.x=-0.6 + reach*0.8;
  armL.position.y=0.2 + Math.sin(t*2)*0.15;
  armR.position.y=0.2 + Math.sin(t*2+1)*0.15;

  // scienziato osserva / scrive
  sci.rotation.y = -0.5 + Math.sin(t*0.8)*0.3;
  sciHead.rotation.y = Math.sin(t*1.2)*0.4;
  sArmR.rotation.z = -0.25 + Math.sin(t*3)*0.15;

  // halo pulse
  halo.scale.setScalar(1+Math.sin(t*2)*0.06);
  halo.rotation.z=t*0.3;

  // anelli pavimento
  scene.children.forEach(o=>{
    if(o.userData && o.userData.i!==undefined){
      o.scale.setScalar(1+Math.sin(t*2+o.userData.i)*0.05);
      o.material.opacity=0.4+Math.sin(t*3+o.userData.i*2)*0.25;
    }
  });

  // particelle: sangue stilizzato quando morde
  if(t>13 && t<20){
    if(Math.random()<0.15){
      const pos=new THREE.Vector3(
        (Math.random()-0.5)*1.0,
        1.4+Math.sin(t)*0.1,
        2.4
      );
      spawnParticle(pos, 0xff2a3a);
    }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.position.add(p.userData.vel);
    p.userData.vel.y-=0.02;
    p.userData.life+=0.016;
    p.material.opacity=1-p.userData.life*0.9;
    p.material.transparent=true;
    p.scale.setScalar(1-p.userData.life*0.5);
    if(p.userData.life>1.2){scene.remove(p);parts.splice(i,1);}
  }

  // luci dinamiche
  rim.intensity=3+Math.sin(t*4)*1.5;
  fill.position.x=Math.sin(t*0.9)*9;
  fill.position.z=Math.cos(t*0.9)*9;

  // title
  titleEl.style.opacity = t<3 ? 0.85 : Math.max(0, 0.85-(t-3)*0.5);

  updateSubs(t);

  renderer.render(scene,camera);
};

/* init */
window.renderFrame(0);

// auto-loop se aperto in browser
let start=performance.now();
(function loop(){
  const t=(performance.now()-start)/1000;
  if(t<=25) window.renderFrame(t);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
